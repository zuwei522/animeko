kotlin.code.style=official
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx1024m"
# Project version, automatically updated by task :ci-helper:updateDevVersionNameFromGit
version.name=4.9.0-dev
# package.version must be major.minor.patch without meta
package.version=5.0.0
kotlin.mpp.androidSourceSetLayoutVersion=2
org.gradle.caching=true
org.gradle.configuration-cache=true
# `android.version.code` Also used in ios
# major(1)-minor(pad to 2)-patch(1)-meta(1)
# \u8FD9\u4E2A\u4E0D\u4F1A\u66F4\u65B0, \u4F46\u7531\u4E8E\u4E00\u6B21\u5931\u8BEF, \u5B83\u88AB\u66F4\u65B0\u5230\u4E86 50406
android.version.code=50406
# CI automatically replaces this
ios.version.code=50406
# TODO AGP Migration: Test android sdk 36
android.compile.sdk=37
android.min.sdk=27
# JBR must have JCEF bundled
# \u672C\u5730\u6784\u5EFA\u73AF\u5883\u4F7F\u7528 Eclipse Temurin JDK 21 (\u65E0 JCEF, \u4EC5\u7528\u4E8E\u7F16\u8BD1 Android APK)
# \u5982\u9700\u6784\u5EFA\u684C\u9762\u7248\u5E76\u4F7F\u7528\u5185\u7F6E\u6D4F\u89C8\u5668, \u8BF7\u6539\u56DE jetbrains \u5E76\u5B89\u88C5 JetBrains Runtime
jvm.toolchain.vendor=any
jvm.toolchain.version=21
# \u6307\u5B9A\u672C\u5730 JDK \u8DEF\u5F84 (\u5F00\u53D1\u73AF\u5883\u6301\u4E45\u5316\u76EE\u5F55), \u4F9B Gradle toolchain \u81EA\u52A8\u68C0\u6D4B
org.gradle.java.installations.paths=/home/user/.super_doubao/super-doubao-runtime/workspace/dev-env/jdk21
kotlin.mpp.enableCInteropCommonization=true
kotlin.apple.xcodeCompatibility.nowarn=true
kotlin.native.ignoreDisabledTargets=true
kotlin.native.enableKlibsCrossCompilation=false
